<div class="app" data-app data-step="intro">
  <header class="bar">
    <a class="bar__logo" data-home href="https://mzollercreations.github.io/zoller-webseite/" aria-label="ZOLLER"><img src="assets/img/zoller.svg" alt="ZOLLER" width="104" height="24"></a>
    <span class="bar__title"><span data-t="ui.title">Werkzeugraum-Planer</span></span>
    <nav class="steps" aria-label="Schritte" data-steps></nav>
    <div class="bar__tools">
      <a class="bar__showroom" data-showroom href="https://mzollercreations.github.io/zoller-produktumgebung-3d/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8 20 7.4v9.2l-8 4.6-8-4.6V7.4z"/><path d="M4 7.4l8 4.6 8-4.6M12 12v9.2"/></svg><span data-t="ui.showroom">3D-Showroom</span></a>
      <div class="langsel"><select data-lang aria-label="Sprache"></select></div>
    </div>
  </header>

  <main class="main">
    <section class="stage" data-stage>
      <canvas></canvas>
      <div class="labels" data-labels></div>
      <div class="hud" data-hud>
        <div class="seg seg--mode" role="group" data-mode>
          <button type="button" data-v="before" data-t="room.before">Heute</button>
          <button type="button" data-v="after" class="is-on" data-t="room.after">Mit ZOLLER</button>
        </div>
        <div class="hud__views" data-views>
          <button type="button" data-view="overview" data-t="room.v.overview">Übersicht</button>
          <button type="button" data-view="toolroom" data-t="room.v.toolroom">Werkzeugraum</button>
          <button type="button" data-view="hall" data-t="room.v.hall">Maschinen</button>
          <button type="button" class="hud__tour" data-tour><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg><span data-t="room.tour">Rundgang starten</span></button>
        </div>
      </div>
      <div class="caption" data-caption hidden></div>
      <div class="ticker" data-ticker hidden></div>
      <div class="loader" data-loader><span data-t="ui.loading">Halle wird aufgebaut …</span><i><b data-progress></b></i></div>
    </section>

    <aside class="panel" data-panel>
      <div class="panel__inner" data-panel-inner></div>
    </aside>
  </main>

  <section class="intro" data-intro>
    <div class="intro__inner">
      <p class="kicker" data-t="intro.kicker">ZOLLER Werkzeugraum-Planer</p>
      <h1 data-t="intro.h1">Beschreiben Sie Ihre Fertigung. Wir planen Ihren Werkzeugraum.</h1>
      <p class="lead" data-t="intro.lead"></p>
      <form class="prompt" data-prompt>
        <textarea rows="4" data-prompt-text data-tp="intro.placeholder" aria-label="Ihre Fertigung"></textarea>
        <div class="prompt__bar">
          <div class="prompt__hits" data-hits aria-live="polite"></div>
          <button class="btn btn--yellow" type="submit"><span data-t="intro.go">Werkzeugraum planen</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
      </form>
      <p class="intro__ex-h" data-t="intro.examples">Oder ein Beispiel wählen:</p>
      <div class="intro__ex" data-examples></div>
      <p class="intro__foot"><button type="button" class="link" data-manual data-t="intro.manual">Lieber Schritt für Schritt eingeben</button><span data-t="intro.trust"></span></p>
    </div>
  </section>

  <section class="gain" data-gain hidden></section>
</div>

<div class="report" data-report></div>
<dialog class="sheet" data-sheet><div class="sheet__inner" data-sheet-inner></div></dialog>
<div class="toast" data-toast role="status" aria-live="polite"></div>
